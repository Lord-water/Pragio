<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 290" role="img" aria-labelledby="t d">
<title id="t">Shared context, separate supervision</title><desc id="d">Dialogue context enters a shared encoder and then two separate heads. Corpus choices supervise the usage head; human judgments supervise the acceptability head.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#82949b"/></marker></defs>
<rect width="1140" height="290" rx="18" fill="#f7f9fb"/>
<g stroke="#82949b" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M212 145H272"/><path d="M458 145H495V77H545"/><path d="M495 145V213H545"/><path d="M872 77H801"/><path d="M872 213H801"/></g>
<g font-family="Segoe UI,sans-serif" text-anchor="middle">
<rect x="34" y="104" width="178" height="82" rx="12" fill="white" stroke="#d9e2e6"/><text x="123" y="140" font-size="18" fill="#173e4b">Dialogue context</text><text x="123" y="164" font-size="13" fill="#667c86">history + target</text>
<rect x="273" y="104" width="185" height="82" rx="12" fill="#183f50"/><text x="365" y="151" font-size="19" fill="white">Shared encoder</text>
<rect x="545" y="34" width="255" height="86" rx="12" fill="#e5edff"/><text x="672" y="70" font-size="19" fill="#254ecc">Usage head</text><text x="672" y="96" font-size="14" fill="#446297">softmax over candidates</text>
<rect x="545" y="170" width="255" height="86" rx="12" fill="#def4eb"/><text x="672" y="206" font-size="19" fill="#087860">Acceptability head</text><text x="672" y="232" font-size="14" fill="#3f7266">one sigmoid per candidate</text>
<text x="981" y="72" font-size="18" fill="#254ecc">Corpus choices</text><text x="981" y="96" font-size="13" fill="#667c86">observed continuation</text>
<text x="981" y="208" font-size="18" fill="#087860">Human judgments</text><text x="981" y="232" font-size="13" fill="#667c86">A / N; unknowns masked</text>
</g></svg>